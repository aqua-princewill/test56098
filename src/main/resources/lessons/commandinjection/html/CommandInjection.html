<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

  <div class="lesson-page-wrapper">
    <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Intro.adoc}"></div>
  </div>

  <div class="lesson-page-wrapper">
    <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Explained.adoc}"></div>
  </div>

  <div class="lesson-page-wrapper">
    <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Task1.adoc}"></div>
    <div class="attack-container">
      <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
      <form class="attack-form" method="POST" th:action="@{/CommandInjection/task1}">
        <label for="t1host">Host to ping</label>
        <input id="t1host" name="host" placeholder="8.8.8.8; whoami" value="8.8.8.8" size="60" />
        <button type="submit">Run Diagnostic</button>
      </form>
      <div class="attack-feedback"></div>
      <div class="attack-output"></div>
    </div>
  </div>

  <div class="lesson-page-wrapper">
    <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Task2.adoc}"></div>
    <div class="attack-container">
      <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
      <form class="attack-form" method="POST" th:action="@{/CommandInjection/task2}">
        <label for="t2host">Host to ping (filter active)</label>
        <input id="t2host" name="host" placeholder="8.8.8.8%0awhoami" size="60" />
        <button type="submit">Run Diagnostic</button>
        <div class="tiny-hint">Blocked characters: ;, &amp;&amp;, |</div>
      </form>
      <div class="attack-feedback"></div>
      <div class="attack-output"></div>
    </div>
  </div>

  <div class="lesson-page-wrapper">
    <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Mitigation.adoc}"></div>
    <div class="attack-container">
      <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
      <form class="attack-form" method="POST" th:action="@{/CommandInjection/mitigation}">
        <label for="mhost">Host to ping (allowlist active)</label>
        <input id="mhost" name="host" placeholder="8.8.8.8; whoami" size="60" />
        <button type="submit">Test Mitigation</button>
      </form>
      <div class="attack-feedback"></div>
      <div class="attack-output"></div>
    </div>
  </div>

</html>
